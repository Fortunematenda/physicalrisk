# Repository MCP — ChatGPT connector (Notion-style OAuth + tools)
server {
    listen 80;
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/apps.physicalrisk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.physicalrisk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_name repo-mcp.localhost repo-mcp.physicalrisk.com;
    client_max_body_size 25m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        set $upstream_repo_mcp repo-mcp:3100;
        proxy_pass http://$upstream_repo_mcp/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # OAuth Protected Resource Metadata (RFC 9728) — required for ChatGPT Connectors
    location ^~ /.well-known/ {
        set $upstream_repo_mcp repo-mcp:3100;
        proxy_pass http://$upstream_repo_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        set $upstream_repo_mcp repo-mcp:3100;
        proxy_pass http://$upstream_repo_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
        keepalive_timeout 75s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
